<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelson Mandela Freedom Fighter Gallery</title>
    <link rel="stylesheet" href="freedom_fighter.css">
</head>
<body>
    <h1>Nelson Mandela Freedom Fighter Gallery</h1>
    
    <div class="gallery-container">
       
        <div class="pics">
            <h3>Main Gallery "Click to add to favorites"</h3>
            <img src="images/image1.jpg" alt="Nelson Mandela - Youth">
            <img src="images/image2.jpg" alt="Nelson Mandela - Prison Years">
            <img src="images/image3.jpg" alt="Nelson Mandela - Release 1990">
            <img src="images/image4.jpg" alt="Nelson Mandela - President 1994">
            <img src="images/image5.jpg" alt="Nelson Mandela - Nobel Prize 1993">
            <img src="images/image6.jpg" alt="Nelson Mandela - Legacy">
        </div>
      
        <div class="favourites">
            <h3>Favorites</h3>
        </div>
        
    
        <div class="actions-container">
            <h3>Actions Log</h3>
            <div class="remaining-text">
                Remaining images: <span id="counter">6</span>
            </div>
            <ul id="actions"></ul>
        </div>
    </div>
    
    <script src="freedom_fighter.js"></script>
</body>
</html>
